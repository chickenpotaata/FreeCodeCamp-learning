<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">Survey Form</h1>
    <p id="description">This is a survey form</p>

    <form id="survey-form">
      <label id="name-label" for="name">name</label>
      <input required id="name" type="text" placeholder="kekkonen">

      <label id="email-label" for="email">email</label>
      <input required id="email" type="email" placeholder="kekkonen">

      <label id="number-label" for="number">age</label>
      <input required id="number" type="number" min="0", max="120" placeholder="kekkonen">

      <select id="dropdown">
        <option>Excellent</option>
        <option>Not so Excellent</option>
      </select>

      <input type="radio" name="kuukkeli" value="som">
      <label>Kekke</label>
      <input type="radio" name="kuukkeli" value="sem">
      <label>Kukka</label>

      <input type="checkbox" value="kek-1">
      <input type="checkbox" value="kek-2">

      <textarea></textarea>
      <button id="submit">Submit</button>
    </form>
  </body>
</html>
